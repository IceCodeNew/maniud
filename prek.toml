#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.13"
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

# Gitleaks owns this exact staged-index hook. The system variant reuses the
# version pinned by .agents/setup instead of compiling a second binary.
[[repos.hooks]]
id = "gitleaks-system"
name = "gitleaks staged changes"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos]]
repo = "local"

# Detect go.mod/go.sum drift without rewriting either file.
[[repos.hooks]]
id = "go-mod-tidy"
name = "go mod tidy"
language = "system"
entry = "go mod tidy -diff"
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# Verify downloaded module content against go.sum.
[[repos.hooks]]
id = "go-mod-verify"
name = "go mod verify"
language = "system"
entry = "go mod verify"
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# golangci-lint owns formatting diagnostics, go vet analyzers, and prealloc.
# The local command stays read-only; the upstream full hook always adds --fix.
[[repos.hooks]]
id = "golangci-lint"
name = "golangci-lint"
language = "system"
entry = "env CGO_ENABLED=0 golangci-lint run --timeout 2m ./..."
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# Keep the interprocedural nil analysis that golangci-lint does not provide.
[[repos.hooks]]
id = "nilaway"
name = "nilaway"
language = "system"
entry = "env CGO_ENABLED=0 nilaway -include-pkgs=github.com/IceCodeNew/maniud ./..."
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# Report reachable vulnerabilities in the built package graph.
[[repos.hooks]]
id = "govulncheck"
name = "govulncheck"
language = "system"
entry = "env CGO_ENABLED=0 govulncheck ./..."
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# Compare command capabilities with the reviewed baseline.
[[repos.hooks]]
id = "capslock"
name = "capslock capability baseline"
language = "system"
entry = "capslock -force_local_module -packages ./cmd/maniud -omit_paths -output compare cmd/maniud/capslock.json"
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# Keep the Linux/Darwin dependency snapshot current for review.
# CI cross-builds, rather than depaware's informational bomb icon, enforce CGO-free builds.
[[repos.hooks]]
id = "depaware"
name = "depaware dependency baseline"
language = "system"
entry = "depaware -check -file depaware.txt -goos linux,darwin -cgo false ./cmd/maniud"
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# Run every package test once, after static and dependency checks, and enforce
# exact statement coverage for production packages from that same execution.
[[repos.hooks]]
id = "go-coverage"
name = "Go tests and statement coverage"
language = "system"
entry = "bash -c"
args = ['''
set -euo pipefail
profile="$(mktemp)"
trap 'rm -f "$profile"' EXIT
CGO_ENABLED=0 go test -count=1 -covermode=atomic -coverpkg=./internal/... -coverprofile="$profile" ./...
report="$(go tool cover -func="$profile")"
printf '%s\n' "$report"
read -r covered total < <(
  awk '
    NR > 1 {
      statements[$1] = $2
      if ($3 > 0) hit[$1] = 1
    }
    END {
      for (block in statements) {
        total += statements[block]
        if (hit[block]) covered += statements[block]
      }
      print covered, total
    }
  ' "$profile"
)
if (( covered != total )); then
  printf 'covered statements are %d/%d, want %d/%d\n' "$covered" "$total" "$total" "$total" >&2
  exit 1
fi
''']
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]
