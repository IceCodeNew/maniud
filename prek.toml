#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "pre-push"]

# Cross-platform path, syntax, and repository-integrity checks. Most hooks are
# read-only; the named fixers normalize text without duplicating Go formatters.
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-vcs-permalinks" },
  { id = "check-xml" },
  { id = "check-yaml" },
  { id = "debug-statements" },
  { id = "destroyed-symlinks" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending" },
  { id = "no-commit-to-branch" },
  { id = "requirements-txt-fixer" },
  { id = "trailing-whitespace" },
]

# Spell-check tracked text before the slower Go analyzers and tests.
[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.48.0"
hooks = [
  { id = "typos" },
]

# Zizmor checks workflow security policy; actionlint checks workflow syntax and expressions.
[[repos]]
repo = "https://github.com/woodruffw/zizmor-pre-commit"
rev = "v1.26.1"
hooks = [
  { id = "zizmor" },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [
  { id = "actionlint" },
]

# The upstream Go hook owns its pinned binary and scans only the staged index.
# CI retains a separate full-history scan.
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks", stages = ["pre-commit"] },
]

[[repos]]
repo = "local"

# Detect go.mod/go.sum drift in every workspace module without rewriting files.
[[repos.hooks]]
id = "go-mod-tidy"
name = "go mod tidy (all modules)"
language = "system"
entry = "scripts/run-go-modules go mod tidy -diff"
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# Verify downloaded module content for every workspace module.
[[repos.hooks]]
id = "go-mod-verify"
name = "go mod verify (all modules)"
language = "system"
entry = "scripts/run-go-modules go mod verify"
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# golangci-lint owns formatting diagnostics, go vet analyzers, and prealloc.
# The local command stays read-only; the upstream full hook always adds --fix.
[[repos.hooks]]
id = "golangci-lint"
name = "golangci-lint"
language = "system"
entry = "scripts/run-go-modules env CGO_ENABLED=0 golangci-lint run --timeout 2m ./..."
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# Report reachable vulnerabilities in the built package graph.
[[repos.hooks]]
id = "govulncheck"
name = "govulncheck"
language = "system"
entry = "scripts/run-go-modules env CGO_ENABLED=0 govulncheck ./..."
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# Compare command capabilities with the reviewed baseline.
[[repos.hooks]]
id = "capslock"
name = "capslock capability baseline"
language = "system"
entry = "capslock -force_local_module -packages ./cmd/maniud -omit_paths -output compare cmd/maniud/capslock.json"
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# Keep depaware's default operating-system and cgo annotations in the reviewed baseline.
[[repos.hooks]]
id = "depaware"
name = "depaware dependency baseline"
language = "system"
entry = "depaware -check -file depaware.txt ./cmd/maniud"
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# Run every package test once, after static and dependency checks. Go's profile
# gates statements; Gobco separately requires both outcomes of each branch.
# CI opts into the race detector; collaborator hooks keep the cheaper default.
[[repos.hooks]]
id = "go-coverage"
name = "Go tests, statement coverage, and branch coverage"
language = "system"
entry = "scripts/check-go-coverage"
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

# Exercise the built CLI across all five public commands without a runtime daemon
# or container CLI. Native CI passes its CGO-free artifact to the same script.
[[repos.hooks]]
id = "command-e2e"
name = "Five-command executable smoke"
language = "system"
entry = "scripts/check-command-e2e"
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]
