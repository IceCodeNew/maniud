name: Release Install Docs

on:
  pull_request:
    paths:
      - ".github/workflows/release-install-docs.yml"
      - "docs/release-verification.md"
      - "docs/release-verification.zh-CN.md"
      - "scripts/check-release-install-docs"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release-install-docs.yml"
      - "docs/release-verification.md"
      - "docs/release-verification.zh-CN.md"
      - "scripts/check-release-install-docs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify documented release install
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify documented release install
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release-install-docs
