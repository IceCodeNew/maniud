name: Checks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Developers and CI compile without cgo unless the race detector opts in.
  CGO_ENABLED: 0

jobs:
  quality:
    name: Quality and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Read shared tool versions
        id: tool-versions
        run: |
          source .agents/tool-versions.sh
          printf 'prek=%s\n' "$PREK_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install policy tools
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          source .agents/tool-versions.sh
          mkdir -p "$GOBIN"
          echo "$GOBIN" >> "$GITHUB_PATH"
          go install github.com/google/capslock/cmd/capslock@"$CAPSLOCK_VERSION"
          go install go.uber.org/nilaway/cmd/nilaway@"$NILAWAY_VERSION"
          go install github.com/tailscale/depaware@"$DEPAWARE_VERSION"
          go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"v$GOLANGCI_LINT_VERSION"
          go install github.com/zricethezav/gitleaks/v8@"$GITLEAKS_VERSION"
      - name: Scan repository history for secrets
        run: gitleaks git --redact --verbose
      - name: Run static and dependency policy hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: ${{ steps.tool-versions.outputs.prek }}
          # Leave the single test execution until all analyzers have passed.
          extra-args: --all-files --stage manual --skip go-coverage
      # NilAway's standalone fact analyzer loads all transitive source. Large
      # pure-Go dependencies make that unsuitable for a collaborator hook, so
      # CI bounds it separately.
      - name: Run interprocedural nil analysis
        timeout-minutes: 12
        run: nilaway -include-pkgs=github.com/IceCodeNew/maniud ./...
      - name: Run tests and statement coverage
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: ${{ steps.tool-versions.outputs.prek }}
          extra-args: go-coverage --all-files --stage manual

  # Native jobs and the Darwin cross-build are the authoritative CGO-free build gates.
  native:
    name: Native ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-26
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native runner
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          test "$(go env GOOS)" = "$EXPECTED_GOOS"
          test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
      - name: Test and build without cgo
        env:
          CGO_ENABLED: 0
        run: |
          go test -count=1 ./...
          go build -trimpath -o "$RUNNER_TEMP/maniud" ./cmd/maniud

  darwin-amd64:
    name: Cross-build darwin/amd64 (theoretical support)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build without cgo
        env:
          CGO_ENABLED: 0
          GOARCH: amd64
          GOOS: darwin
        run: go build -trimpath -o "$RUNNER_TEMP/maniud" ./cmd/maniud

  # go test -race executes instrumented binaries; a build-only race step detects no races.
  race:
    name: Data race detector
    needs: [quality, native, darwin-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test all packages with the race detector
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 ./...
