name: Checks

on:
  pull_request:
  push:
    branches:
      - master
      - "renovate/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match .agents/setup; race steps opt into cgo explicitly.
  CGO_ENABLED: 0
  GOPROXY: https://golang.flatt.tech

jobs:
  quality:
    name: Quality and dependency policy
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Read shared tool versions
        id: tool-versions
        run: |
          source .agents/tool-versions.sh
          {
            printf 'mise-tools<<EOF\n'
            printf 'golangci-lint %s\n' "$GOLANGCI_LINT_VERSION"
            printf 'gitleaks %s\n' "${GITLEAKS_VERSION#v}"
            printf 'go:github.com/google/capslock/cmd/capslock %s\n' "$CAPSLOCK_VERSION"
            printf 'go:github.com/rillig/gobco %s\n' "$GOBCO_VERSION"
            printf 'go:go.uber.org/nilaway/cmd/nilaway %s\n' "$NILAWAY_VERSION"
            printf 'go:github.com/tailscale/depaware %s\n' "$DEPAWARE_VERSION"
            printf 'go:golang.org/x/vuln/cmd/govulncheck %s\n' "$GOVULNCHECK_VERSION"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"
      # golangci-lint and Gitleaks use release binaries. mise caches the Go-built
      # tools that do not publish binaries, so unchanged CI runs do not rebuild them.
      - name: Install cached policy tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          tool_versions: ${{ steps.tool-versions.outputs.mise-tools }}
          cache: true
      - name: Scan repository history for secrets
        run: gitleaks git --redact --verbose
      - name: Run static and dependency policy hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          # Leave the single test execution until all analyzers have passed.
          extra-args: --all-files --stage manual --skip go-coverage
      # NilAway's standalone fact analyzer loads all transitive source. Large
      # pure-Go dependencies make that unsuitable for a collaborator hook, so
      # CI bounds it separately.
      - name: Run interprocedural nil analysis
        timeout-minutes: 12
        run: nilaway -include-pkgs=github.com/IceCodeNew/maniud ./...
      - name: Run tests, race detector, statement coverage, and branch coverage
        env:
          MANIUD_CI_RACE: 1
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: go-coverage --all-files --stage manual

  # Native jobs and the Darwin cross-build are the authoritative CGO-free build gates.
  native:
    name: Native ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-26
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native runner
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          test "$(go env GOOS)" = "$EXPECTED_GOOS"
          test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
      # Quality already runs every Linux test with coverage and the race detector.
      # Darwin has distinct filesystem implementations and build-tagged tests.
      - name: Test Darwin packages with race and coverage
        if: matrix.goos == 'darwin'
        env:
          CGO_ENABLED: 1
          MANIUD_CI_RACE: 1
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: go-coverage --all-files --stage manual
      - name: Build without cgo
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o "$RUNNER_TEMP/maniud" ./cmd/maniud
      - name: Smoke-test built executable
        run: |
          output="$("$RUNNER_TEMP/maniud" --help)"
          grep -Fq 'Usage: maniud ' <<< "$output"

  darwin-amd64:
    name: Cross-build darwin/amd64 (theoretical support)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build without cgo
        env:
          CGO_ENABLED: 0
          GOARCH: amd64
          GOOS: darwin
        run: go build -trimpath -o "$RUNNER_TEMP/maniud" ./cmd/maniud
