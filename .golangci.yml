version: "2"

linters:
  # Run the broad suite, then document exclusions whose signal does not justify
  # their maintenance cost. Prek invokes this suite instead of duplicating it.
  default: all
  disable:
    # Slow analyzers for frameworks or generated APIs absent from this project.
    - arangolint
    - clickhouselint
    - ginkgolinter
    - protogetter
    - spancheck
    - testifylint

    # First-party structured logging defaults to log/slog, which the enabled
    # sloglint, loggercheck, and govet analyzers cover. This slow analyzer only
    # checks whether zerolog events end with Send or Msg.
    - zerologlint

    # Slow blanket style rules with high false-positive or rewrite cost. Fast
    # formatting, naming, complexity, and autofix rules remain enabled.
    - exhaustruct
    - exhaustruct_v5
    - noinlineerr
    - nonamedreturns
    - varnamelen
    - wsl_v5

    # White-box tests intentionally remain in-package.
    - testpackage

    # Deprecated rules have current replacements in the enabled all set.
    - gomodguard
    - wsl
  settings:
    # depguard owns source import boundaries. gomodguard_v2 stays enabled and
    # fast, but has no exact-version allowlist: Renovate and go.mod/go.sum own
    # versions until the project defines a block or replacement policy.
    depguard:
      rules:
        project:
          list-mode: strict
          files:
            - $all
            - "!**/imageref/*.go"
            - "!**/internal/backup/*.go"
            - "!**/internal/store/*.go"
            - "!**/internal/compose/*.go"
            - "!**/internal/composeext/maniud/*.go"
            - "!**/internal/imageref/*.go"
            - "!**/internal/imagerootfs/*.go"
            - "!**/internal/notification/*.go"
            - "!**/internal/registry/*.go"
            - "!**/internal/tui/*.go"
            - "!**/internal/cli/parse.go"
            - "!**/internal/custombuild/*.go"
            - "!**/containerconfig/compose/*.go"
            - "!**/containerconfig/containerd/*.go"
            - "!**/containerconfig/docker/*.go"
            - "!**/containerconfig/podman/*.go"
            - "!**/plugins/runtime/containerd/*.go"
            - "!**/plugins/runtime/docker/*.go"
            - "!**/plugins/runtime/podman/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/google/go-cmp
        custom-builder:
          list-mode: strict
          files:
            - "**/internal/custombuild/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - golang.org/x/mod
        cli-syntax-adapter:
          list-mode: strict
          files:
            - "**/internal/cli/parse.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/alecthomas/kong
        public-imageref:
          list-mode: strict
          files:
            - "**/imageref/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/distribution/reference
            - github.com/opencontainers/go-digest
        persistence-adapter:
          list-mode: strict
          files:
            - "**/internal/store/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/google/go-cmp
            - golang.org/x/sys
            - modernc.org/sqlite
        compose-adapter:
          list-mode: strict
          files:
            - "**/internal/compose/*.go"
            - "**/containerconfig/compose/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/compose-spec/compose-go/v2
            - github.com/opencontainers/go-digest
            - go.yaml.in/yaml/v4
        public-containerd-adapter:
          list-mode: strict
          files:
            - "**/containerconfig/containerd/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/opencontainers/runtime-spec
        public-podman-adapter:
          list-mode: strict
          files:
            - "**/containerconfig/podman/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
        maniud-compose-extension:
          list-mode: strict
          files:
            - "**/internal/composeext/maniud/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/opencontainers/go-digest
        imageref-domain-adapter:
          list-mode: strict
          files:
            - "**/internal/imageref/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/opencontainers/go-digest
        image-rootfs:
          list-mode: strict
          files:
            - "**/internal/imagerootfs/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/google/go-containerregistry
            - github.com/moby/sys/user
        registry:
          list-mode: strict
          files:
            - "**/internal/registry/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/opencontainers/go-digest
            - github.com/opencontainers/image-spec
            - golang.org/x/sys
            - oras.land/oras-go/v2
        backup:
          list-mode: strict
          files:
            - "**/internal/backup/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - golang.org/x/sys
            - golang.org/x/text
        notification-adapter:
          list-mode: strict
          files:
            - "**/internal/notification/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/nikoksr/notify
        tui-adapter:
          list-mode: strict
          files:
            - "**/internal/tui/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - charm.land/bubbletea/v2
        public-docker-adapter:
          list-mode: strict
          files:
            - "**/containerconfig/docker/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/moby/moby/api
        containerd-adapter:
          list-mode: strict
          files:
            - "**/plugins/runtime/containerd/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/containerd/containerd/api
            - github.com/containerd/containerd/v2
            - github.com/containerd/continuity
            - github.com/containerd/log
            - github.com/containernetworking/cni
            - github.com/opencontainers/go-digest
            - github.com/opencontainers/image-spec
            - github.com/opencontainers/runtime-spec
            - github.com/sirupsen/logrus
            - golang.org/x/sys
            - google.golang.org/grpc
            - google.golang.org/protobuf
        docker-adapter:
          list-mode: strict
          files:
            - "**/plugins/runtime/docker/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/google/go-cmp
            - github.com/moby/moby/api
            - golang.org/x/crypto
        podman-adapter:
          list-mode: strict
          files:
            - "**/plugins/runtime/podman/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - golang.org/x/sys
    # Public adapter modules use repository-relative replacements while this
    # monorepo develops a shared release. The pinned notify fork is the only
    # external replacement.
    gomoddirectives:
      replace-local: true
      replace-allow-list:
        - github.com/nikoksr/notify
    nolintlint:
      require-explanation: true
      require-specific: true
    tagliatelle:
      case:
        rules:
          json: snake

formatters:
  # `golangci-lint run` reports formatter drift, so prek does not duplicate
  # gofmt/goimports hooks. Developers can apply both with golangci-lint fmt.
  enable:
    - gofmt
    - goimports
