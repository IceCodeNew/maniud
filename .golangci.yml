version: "2"

linters:
  default: all
  disable:
    # Replaced by gomodguard_v2 in golangci-lint v2.12.
    - gomodguard
    # White-box parser tests avoid exporting a test-only public API.
    - testpackage
    # Replaced by wsl_v5 in golangci-lint v2.2.
    - wsl
  settings:
    depguard:
      rules:
        project:
          list-mode: strict
          files:
            - $all
            - "!**/internal/compose/*.go"
            - "!**/internal/runtime/docker/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
        compose-adapter:
          list-mode: strict
          files:
            - "**/internal/compose/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/compose-spec/compose-go/v2
            - go.yaml.in/yaml/v4
            - oras.land/oras-go/v2
        docker-adapter:
          list-mode: strict
          files:
            - "**/internal/runtime/docker/*.go"
          allow:
            - $gostd
            - github.com/IceCodeNew/maniud
            - github.com/moby/moby/api
            - golang.org/x/crypto
    gomodguard_v2:
      allowed:
        - module: github.com/compose-spec/compose-go/v2
          version: "= 2.14.0"
        - module: github.com/moby/moby/api
          version: "= 1.55.0"
        - module: go.yaml.in/yaml/v4
          version: "= 4.0.0-rc.4"
        - module: golang.org/x/crypto
          version: "= 0.55.0"
        - module: oras.land/oras-go/v2
          version: "= 2.6.2"
    nolintlint:
      require-explanation: true
      require-specific: true
    tagliatelle:
      case:
        rules:
          json: snake

formatters:
  enable:
    - gofmt
    - goimports
